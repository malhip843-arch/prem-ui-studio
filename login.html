
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Prem UI Studio</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.box {
  background: #1e293b;
  padding: 30px;
  border-radius: 15px;
  width: 320px;
  max-width: 85%;
}
h2 { text-align: center; }
input, button {
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  box-sizing: border-box;
  border-radius: 7px;
}
input { border: 1px solid #64748b; }
button {
  background: #6366f1;
  color: white;
  border: 0;
  cursor: pointer;
}
a { color: #a5b4fc; }
#message { text-align: center; }
</style>
</head>
<body>
<div class="box">
<h2>Welcome Back</h2>
<form id="loginForm">
<input type="text" id="phone" placeholder="Phone Number" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<p id="message"></p>
<p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();
  document.getElementById("message").textContent =
    "Login system is not connected yet. Please try again later.";
});
</script>
</body>
</html>
