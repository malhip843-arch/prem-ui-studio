
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prem UI Studio - Sign Up</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #101827;
  font-family: Arial, sans-serif;
  color: white;
  padding: 20px;
}
.container {
  width: 100%;
  max-width: 420px;
  background: #1c293b;
  padding: 30px;
  border-radius: 15px;
}
h1 { text-align: center; }
p { text-align: center; color: #bdc9d9; }
input {
  width: 100%;
  padding: 13px;
  margin: 9px 0;
  border: 1px solid #40516a;
  border-radius: 7px;
  background: #101827;
  color: white;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: 0;
  border-radius: 7px;
  background: #3878f5;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
#message {
  text-align: center;
  margin-top: 15px;
  overflow-wrap: anywhere;
}
a { color: #75a7ff; }
</style>
</head>
<body>

<div class="container">
  <h1>Create Account</h1>
  <p>Join Prem UI Studio</p>

  <form id="signupForm">
    <input id="fullName" type="text"
      placeholder="Full Name" required>

    <input id="email" type="email"
      placeholder="Email Address">

    <input id="phone" type="tel"
      placeholder="Phone Number (+923...)" required>

    <input id="password" type="password"
      placeholder="Password (minimum 8 characters)"
      minlength="8" required>

    <input id="confirmPassword" type="password"
      placeholder="Confirm Password" required>

    <button id="signupButton" type="submit">
      Create Account
    </button>
  </form>

  <div id="message"></div>
  <p>Already registered? <a href="login.html">Login</a></p>
</div>

<script>
const form = document.getElementById("signupForm");
const message = document.getElementById("message");
const button = document.getElementById("signupButton");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const fullName = document.getElementById("fullName").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    message.textContent = "Passwords do not match!";
    return;
  }

  button.disabled = true;
  button.textContent = "Please wait...";
  message.textContent = "";

  try {
    const response = await fetch(
      "https://prem-ui-studio-production.up.railway.app/api/signup",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          fullName,
          email,
          phone,
          password
        })
      }
    );

    const result = await response.json();

    if (response.ok) {
message.textContent = "Account created! Redirecting...";
window.location.href = "verify.html";
      message.style.color = "#62e69b";
      form.reset();
    } else {
      message.textContent = result.message || "Signup failed.";
      message.style.color = "#ff7777";
    }

  } catch (error) {
    message.textContent = "Connection error. Please try again.";
    message.style.color = "#ff7777";
  }

  button.disabled = false;
  button.textContent = "Create Account";
});
</script>

</body>
</html>
